<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">GroundsOps AI production architecture</title>
  <desc id="desc">Users reach a Next.js web application served by Caddy. It calls a FastAPI service authenticated by Amazon Cognito. The API stores data in PostgreSQL and private files in S3, edits images through Replicate FLUX Fill Pro, and bills through Stripe. GitHub Actions, Terraform, Docker Compose, security scanning, systemd monitors, AWS alarms and verified backups operate the system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07140e"/><stop offset="1" stop-color="#123d2a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7ddd9e"/></marker>
    <style>
      text{text-anchor:middle;dominant-baseline:auto}
      .title{font:700 38px system-ui,sans-serif;fill:#fff}.subtitle{font:18px system-ui,sans-serif;fill:#b7d8c2}
      .lane{fill:#0c2117;stroke:#2f6847;stroke-width:2}.box{fill:#f7faf7;stroke:#b9d8c4;stroke-width:2;filter:url(#shadow)}
      .head{font:700 21px system-ui,sans-serif;fill:#0a2115}.body{font:15px system-ui,sans-serif;fill:#345343}.small{font:13px system-ui,sans-serif;fill:#557164}
      .line{fill:none;stroke:#7ddd9e;stroke-width:3.5;marker-end:url(#arrow)}
      .tag{fill:#dff7e7;stroke:#7acb96}.tagtext{font:700 13px system-ui,sans-serif;fill:#125f35}
      .ops{fill:#123a28;stroke:#3d8a5e;stroke-width:2;stroke-dasharray:8 7}
      .opshead{font:700 20px system-ui,sans-serif;fill:#dff7e7}.opsbody{font:15px system-ui,sans-serif;fill:#b7d8c2}
    </style>
  </defs>
  <rect width="1400" height="900" rx="30" fill="url(#bg)"/>
  <text x="700" y="72" class="title">GroundsOps AI — production system</text>
  <text x="700" y="106" class="subtitle">Site photo → AI concept → measurement → estimate → quote → scheduled job → invoice</text>
  <rect x="30" y="140" width="1340" height="670" rx="26" class="lane"/>
  <path d="M344 280 H382" class="line"/>
  <path d="M674 280 H712" class="line"/>
  <path d="M1046 280 H1008" class="line"/>
  <path d="M792 374 C792 430, 200 410, 200 462" class="line"/>
  <path d="M826 374 C826 430, 530 410, 530 462" class="line"/>
  <path d="M860 374 V462" class="line"/>
  <path d="M894 374 C894 430, 1190 410, 1190 462" class="line"/>
  <rect x="60" y="190" width="280" height="180" rx="18" class="box"/>
  <text x="200" y="234" class="head">Field &amp; office users</text>
  <text x="200" y="270" class="body">Desktop &amp; mobile browser</text>
  <text x="200" y="298" class="body">Camera capture</text>
  <text x="200" y="326" class="small">Admin · designer · crew</text>
  <rect x="390" y="190" width="280" height="180" rx="18" class="box"/>
  <text x="530" y="234" class="head">Web application</text>
  <text x="530" y="270" class="body">Next.js + TypeScript</text>
  <text x="530" y="298" class="body">Mask editor &amp; field tools</text>
  <rect x="482.1" y="330" width="95.8" height="26" rx="13" class="tag"/>
  <text x="530" y="348" class="tagtext">Caddy TLS</text>
  <rect x="720" y="190" width="280" height="180" rx="18" class="box"/>
  <text x="860" y="234" class="head">Application API</text>
  <text x="860" y="270" class="body">FastAPI + SQLAlchemy</text>
  <text x="860" y="298" class="body">Tenant RBAC · signed URLs</text>
  <rect x="803.9" y="330" width="112.2" height="26" rx="13" class="tag"/>
  <text x="860" y="348" class="tagtext">Python 3.12</text>
  <rect x="1050" y="190" width="280" height="180" rx="18" class="box"/>
  <text x="1190" y="234" class="head">Amazon Cognito</text>
  <text x="1190" y="270" class="body">OIDC / JWT sign-in</text>
  <text x="1190" y="298" class="body">Optional TOTP MFA</text>
  <text x="1190" y="326" class="small">Tenant identity</text>
  <rect x="60" y="470" width="280" height="170" rx="18" class="box"/>
  <text x="200" y="514" class="head">PostgreSQL</text>
  <text x="200" y="550" class="body">Customers, designs, jobs</text>
  <text x="200" y="578" class="body">Quotes, invoices, reviews</text>
  <text x="200" y="606" class="small">Alembic migrations</text>
  <rect x="390" y="470" width="280" height="170" rx="18" class="box"/>
  <text x="530" y="514" class="head">Private object storage</text>
  <text x="530" y="550" class="body">Amazon S3 + encryption</text>
  <text x="530" y="578" class="body">Site photos &amp; outputs</text>
  <text x="530" y="606" class="small">Short-lived signed URLs</text>
  <rect x="720" y="470" width="280" height="170" rx="18" class="box"/>
  <text x="860" y="514" class="head">AI image provider</text>
  <text x="860" y="550" class="body">Replicate · FLUX Fill Pro</text>
  <text x="860" y="578" class="body">Masked edits, composited</text>
  <text x="860" y="606" class="small">Quality gates · cost tracking</text>
  <rect x="1050" y="470" width="280" height="170" rx="18" class="box"/>
  <text x="1190" y="514" class="head">Stripe billing</text>
  <text x="1190" y="550" class="body">Checkout + customer portal</text>
  <text x="1190" y="578" class="body">Signed webhooks</text>
  <text x="1190" y="606" class="small">Trials · read-only lockout</text>
  <rect x="60" y="690" width="1270" height="96" rx="18" class="ops"/>
  <text x="700" y="728" class="opshead">Operations &amp; delivery</text>
  <text x="700" y="760" class="opsbody">GitHub Actions CI/CD · Terraform on AWS · Docker Compose · Trivy + Gitleaks · systemd monitors + AWS alarms · verified backups</text>
  <text x="700" y="858" class="subtitle">AWS · Terraform · Docker · PostgreSQL · S3 · Cognito · Stripe · Replicate · FastAPI · Next.js · GitHub Actions</text>
</svg>
