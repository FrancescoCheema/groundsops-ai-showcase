services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: groundsops
      POSTGRES_USER: groundsops
      POSTGRES_PASSWORD: groundsops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundsops -d groundsops"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://groundsops:groundsops@db:5432/groundsops
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

