services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: groundsops
      POSTGRES_USER: groundsops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundsops -d groundsops"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - private
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: postgresql+psycopg://groundsops:${POSTGRES_PASSWORD}@db:5432/groundsops
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - private
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}
        NEXT_PUBLIC_AUTH_MODE: cognito
        NEXT_PUBLIC_COGNITO_REGION: ${AWS_REGION}
        NEXT_PUBLIC_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
        NEXT_PUBLIC_STORAGE_DIRECT_URLS: "true"
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  private:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

