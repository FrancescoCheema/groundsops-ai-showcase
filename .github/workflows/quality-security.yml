name: Quality and security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]" pip-audit
      - run: ruff check .
      - run: pytest
      - run: pip-audit

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
      - name: Block critical production dependency findings
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: groundsops
          POSTGRES_USER: groundsops
          POSTGRES_PASSWORD: groundsops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundsops -d groundsops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      AUTH_MODE: development
      DATABASE_URL: postgresql+psycopg://groundsops:groundsops@127.0.0.1:5432/groundsops
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_AUTH_MODE: development
      PLAYWRIGHT_API_URL: http://127.0.0.1:8000
      INFERENCE_PROVIDER: mock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: alembic upgrade head
      - name: Start API
        run: |
          uvicorn groundsops.main:app --host 127.0.0.1 --port 8000 > /tmp/groundsops-api.log 2>&1 &
          echo $! > /tmp/groundsops-api.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ready && exit 0
            sleep 2
          done
          cat /tmp/groundsops-api.log
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
