name: Public release gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 14 * * 1"
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

jobs:
  public-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -e .
      - name: Validate staging Compose
        run: |
          cp .env.staging.example .env.staging
          docker compose --env-file .env.staging -f docker-compose.staging.yml config --quiet
      - name: Block unsafe public files
        shell: pwsh
        run: ./scripts/audit-public-release.ps1 -SkipGitleaks
      - name: Inspect public image metadata and filenames
        run: python scripts/scan-public-assets.py
      - name: Scan complete Git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  backup-restore:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: groundsops
          POSTGRES_USER: groundsops
          POSTGRES_PASSWORD: groundsops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U groundsops -d groundsops"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: groundsops
      DATABASE_URL: postgresql+psycopg://groundsops:groundsops@127.0.0.1:5432/groundsops
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m pip install -e .
      - run: alembic upgrade head
      - run: bash scripts/verify-backup-restore.sh

  load-smoke:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: groundsops
          POSTGRES_USER: groundsops
          POSTGRES_PASSWORD: groundsops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U groundsops -d groundsops"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      AUTH_MODE: development
      INFERENCE_PROVIDER: mock
      DATABASE_URL: postgresql+psycopg://groundsops:groundsops@127.0.0.1:5432/groundsops
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: alembic upgrade head
      - run: uvicorn groundsops.main:app --host 127.0.0.1 --port 8000 >/tmp/api.log 2>&1 &
      - run: for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ready && break; sleep 1; done
      - run: python scripts/load-smoke.py --url http://127.0.0.1:8000/ready --requests 500 --concurrency 25 --p95-ms 750 --max-error-rate 0.01

